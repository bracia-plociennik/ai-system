name: AI System Validate

on:
  pull_request:
  push:
    branches:
      - ai-system

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure scripts are executable
        run: chmod +x .systems/scripts/*

      - name: Validate AI System
        run: .systems/scripts/validate-ai-system

      - name: Check whitespace
        run: git diff --check
