name: AI System Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Ensure scripts are executable
        run: chmod +x .systems/scripts/*

      - name: Prepare isolated work evidence validation environment
        run: |
          python3 -m venv "$RUNNER_TEMP/work-evidence-venv"
          "$RUNNER_TEMP/work-evidence-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r .systems/ai/templates/work-evidence/requirements-xlsx.txt
          echo "WORK_EVIDENCE_PYTHON=$RUNNER_TEMP/work-evidence-venv/bin/python" >> "$GITHUB_ENV"

      - name: Validate AI System
        run: .systems/scripts/validate-ai-system --profile full

      - name: Check whitespace
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            git diff --check HEAD^ HEAD
          fi
