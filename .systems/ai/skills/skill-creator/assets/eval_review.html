<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trigger Eval Review</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 2rem; color: #161616; }
    main { max-width: 1040px; margin: 0 auto; }
    textarea { width: 100%; min-height: 4rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #c9c9c9; padding: 0.5rem; text-align: left; vertical-align: top; }
    th { background: #f1f1f1; }
    button { margin-top: 1rem; padding: 0.5rem 0.75rem; }
  </style>
</head>
<body>
  <main>
    <h1>Trigger Eval Review</h1>
    <p><strong>Skill:</strong> <span id="skill-name">__SKILL_NAME__</span></p>
    <p><strong>Description:</strong> <span id="skill-description">__SKILL_DESCRIPTION__</span></p>
    <table>
      <thead>
        <tr><th>Query</th><th>Should Trigger</th><th>Reason</th></tr>
      </thead>
      <tbody id="eval-rows"></tbody>
    </table>
    <button id="export">Download trigger-evals.json</button>
  </main>
  <script>
    const evalData = {
      skill_name: "",
      current_description: "",
      queries: [],
      holdout_fraction: 0.4
    };
    document.getElementById("skill-name").textContent = evalData.skill_name || "__SKILL_NAME__";
    document.getElementById("skill-description").textContent = evalData.current_description || "__SKILL_DESCRIPTION__";
    const rows = document.getElementById("eval-rows");
    for (const item of evalData.queries || []) {
      const tr = document.createElement("tr");
      const queryCell = document.createElement("td");
      const query = document.createElement("textarea");
      query.dataset.field = "query";
      query.value = item.query || "";
      queryCell.appendChild(query);

      const triggerCell = document.createElement("td");
      const shouldTrigger = document.createElement("input");
      shouldTrigger.type = "checkbox";
      shouldTrigger.dataset.field = "should_trigger";
      shouldTrigger.checked = item.should_trigger === true;
      triggerCell.appendChild(shouldTrigger);

      const reasonCell = document.createElement("td");
      const reason = document.createElement("textarea");
      reason.dataset.field = "reason";
      reason.value = item.reason || "";
      reasonCell.appendChild(reason);

      tr.appendChild(queryCell);
      tr.appendChild(triggerCell);
      tr.appendChild(reasonCell);
      rows.appendChild(tr);
    }
    document.getElementById("export").addEventListener("click", () => {
      const queries = Array.from(rows.querySelectorAll("tr")).map((row, index) => ({
        id: `trigger-${String(index + 1).padStart(3, "0")}`,
        query: row.querySelector('[data-field="query"]').value,
        should_trigger: row.querySelector('[data-field="should_trigger"]').checked,
        reason: row.querySelector('[data-field="reason"]').value
      }));
      const output = {
        skill_name: document.getElementById("skill-name").textContent,
        current_description: document.getElementById("skill-description").textContent,
        queries,
        holdout_fraction: evalData.holdout_fraction || 0.4
      };
      const blob = new Blob([JSON.stringify(output, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "trigger-evals.json";
      link.click();
      URL.revokeObjectURL(link.href);
    });
  </script>
</body>
</html>
